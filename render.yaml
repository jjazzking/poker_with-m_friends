# Render 블루프린트 — 저장소를 연결하고 "New > Blueprint" 로 배포하면 된다.
# 무료 플랜은 15분간 요청이 없으면 잠들고, 다음 접속 때 40~60초쯤 걸려 깨어난다.
# (클라이언트가 "서버를 깨우는 중" 이라고 안내하고 자동으로 재시도한다)
services:
  - type: web
    name: poker-with-friends
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      # 방 상태 저장 위치. 무료 플랜에는 영구 디스크가 없어 재배포 시에는 비워지지만,
      # 프로세스 재시작(크래시·슬립 해제)까지는 스택이 보존된다.
      - key: DATA_DIR
        value: /tmp/poker-data
      # 배포 후 Pages 주소로 좁히는 것을 권장한다.
      #   예: https://jjazzking.github.io
      - key: ALLOWED_ORIGINS
        sync: false
