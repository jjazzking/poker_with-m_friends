name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      # 작업 중인 브랜치들. main 으로 합친 뒤에는 지워도 됩니다.
      - claude/poker-multiplayer-site-eo2rds
      - claude/screen-access-issue-4rjjck
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 게임 엔진 테스트
        run: npm test

      - name: 정적 사이트 빌드
        # 저장소 Variables 에 POKER_SERVER_URL 을 넣어 두면 중앙 서버 모드로 빌드됩니다.
        # (Settings > Secrets and variables > Actions > Variables)
        # 비어 있으면 서버 없이 도는 P2P 폴백으로 빌드됩니다.
        env:
          POKER_SERVER_URL: ${{ vars.POKER_SERVER_URL }}
        run: npm run build

      - name: 배포 모드 확인
        run: |
          if [ -n "${{ vars.POKER_SERVER_URL }}" ]; then
            echo "::notice::중앙 서버 모드로 빌드됨 → ${{ vars.POKER_SERVER_URL }}"
          else
            echo "::warning::POKER_SERVER_URL 이 설정되지 않아 P2P 폴백으로 빌드됩니다. 저장소 Variables 에 서버 주소를 넣어 주세요."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
