name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      # 지금 작업 중인 브랜치. main 으로 합친 뒤에는 이 줄을 지워도 됩니다.
      - claude/poker-multiplayer-site-eo2rds
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 게임 엔진 테스트
        run: npm test

      - name: 정적 사이트 빌드
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
